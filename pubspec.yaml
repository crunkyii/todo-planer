name: todo_liste
description: "ToDo Planer: Todo-Liste mit Gewohnheiten, Kalender und Wochenplan – offline-first mit optionalem Supabase-Sync."
# Eine App, kein Paket: wird nie auf pub.dev veröffentlicht.
publish_to: 'none'

# Versionsname + Buildnummer (Android: versionName + versionCode).
version: 1.4.3+8

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Oberfläche (ersetzt das veraltete `flutter/material.dart`)
  material_ui: ^1.1.0
  # Daten: lokale SQLite-Datenbank, Einstellungen, Supabase-Sync
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  connectivity_plus: ^7.3.2
  # Erinnerungen
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  # Texte und Datumsformate
  intl: ^0.20.3
  # Export (PDF erzeugen, „Speichern unter“)
  pdf: 3.13.1
  file_picker: 13.4.0
  # Link zum Supabase-Dashboard in der Einrichtung
  url_launcher: ^6.3.3
  http: 1.6.0
  cryptography: 2.9.0
  package_info_plus: 10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Erzeugt lib/l10n/gen aus den ARB-Dateien (siehe l10n.yaml).
  generate: true

  # Das Datenbank-Schema wird in der Einrichtung per „SQL kopieren“ angeboten.
  assets:
    - supabase/schema.sql
    # Symbole der Flick-Shortcuts (Windows), siehe lib/services/flick_export.dart.
    - assets/flick/
