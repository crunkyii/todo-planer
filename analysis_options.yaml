# Regeln für `flutter analyze` (muss „No issues found“ melden).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
    - linux/**
    # Aus den ARB-Dateien erzeugt
    - lib/l10n/gen/**

# `dart format` bricht erst bei 120 Zeichen um.
formatter:
  page_width: 120
